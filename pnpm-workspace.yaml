packages:
    - "apps/docs"

    - "packages/addon-indexeddb"
    - "packages/cli"
    - "packages/client"
    - "packages/crdt"
    - "packages/crdt-loro"
    - "packages/crdt-yjs"
    - "packages/io"
    - "packages/persistence-cloudflare-transactional-storage"
    - "packages/persistence-redis"
    - "packages/platform-cloudflare"
    - "packages/platform-node"
    - "packages/platform-pluv"
    - "packages/react"
    - "packages/tsconfig"
    - "packages/types"

    - "tests/e2e"
    - "tests/types"
    - "tests/unit"
allowBuilds:
    "@swc/core": true
    better-sqlite3: true
    core-js-pure: true
    esbuild: true
    sharp: true
    workerd: true
# Match Renovate `minimumReleaseAge` (1 day). pnpm 12 defaults to this; set
# explicitly so the policy is not tied to whatever the current default is.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
    - "@cloudflare/workers-types@4.20260524.1"
