name: Release

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            tag:
                description: npm dist-tag
                type: choice
                default: canary
                options:
                    - canary
                    - rc

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    id-token: write
    contents: write
    pull-requests: write

jobs:
    release:
        name: Release
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7

            - name: Setup Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x

            - name: Setup pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: Install Dependencies
              run: pnpm install

            - name: Create Release Pull Request or Publish to npm
              id: changesets
              uses: changesets/action@v2
              with:
                  # this expects you to have a script called release, which does a build
                  # for your packages and calls changeset publish
                  publish-script: pnpm release
                  commit-message: "chore: version packages"
                  pr-title: "chore: version packages"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    snapshot:
        name: Publish snapshot
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x

            - name: Setup pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: Install Dependencies
              run: pnpm install

            - name: Version snapshot
              env:
                  SNAPSHOT_TAG: ${{ inputs.tag }}
              run: pnpm changeset version --snapshot "$SNAPSHOT_TAG"

            - name: Build
              run: pnpm turbo run build --filter=./packages/*

            - name: Publish snapshot
              env:
                  NPM_CONFIG_PROVENANCE: true
                  SNAPSHOT_TAG: ${{ inputs.tag }}
              run: pnpm changeset publish --tag "$SNAPSHOT_TAG" --no-git-tag
